[project]
name = "miem-bot"
version = "0.1.0"
description = "Telegram assistant for MIEM HSE with hybrid retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
bot = ["aiogram>=3.17,<4", "redis>=5.2,<7"]
deploy = ["paramiko>=5,<6"]
rag = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=1.60,<3",
    "numpy>=1.26,<3", "faiss-cpu>=1.9,<2", "rank-bm25>=0.2.2,<0.3",
    "nltk>=3.9,<4", "python-docx>=1.1,<2", "pypdf>=5,<7", "openpyxl>=3.1,<4",
    "sentence-transformers>=3.4,<6", "torch>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1",
    "fakeredis[lua]>=2.26,<3",
    "fastapi>=0.115,<1", "openai>=1.60,<3", "numpy>=1.26,<3",
    "faiss-cpu>=1.9,<2", "rank-bm25>=0.2.2,<0.3", "nltk>=3.9,<4",
    "python-docx>=1.1,<2", "pypdf>=5,<7", "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
