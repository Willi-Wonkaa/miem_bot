name: System status

on:
  workflow_dispatch:
    inputs:
      repair_monitor:
        description: "Restart only the host monitor to release an inherited legacy deploy lock"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen --no-dev --extra deploy --python 3.12
      - name: Read server status without restarting services
        run: uv run --frozen --no-dev --extra deploy python scripts/remote_status.py
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REPAIR_MONITOR: ${{ inputs.repair_monitor }}
